<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="60%" style="stop-color:#0D1F3C"/>
      <stop offset="100%" style="stop-color:#0A2540"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3BA8FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3BA8FF;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="1200" height="400" fill="url(#heroBg)"/>

  <!-- Orange glow left -->
  <ellipse cx="100" cy="200" rx="300" ry="200" fill="url(#orangeGlow)"/>

  <!-- Blue glow right -->
  <ellipse cx="1100" cy="150" rx="350" ry="250" fill="url(#blueGlow)"/>

  <!-- Top orange bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#FF6B00"/>

  <!-- Decorative grid dots (right side) -->
  <g opacity="0.06" fill="#FFFFFF">
    <circle cx="750" cy="60" r="2"/><circle cx="790" cy="60" r="2"/><circle cx="830" cy="60" r="2"/><circle cx="870" cy="60" r="2"/><circle cx="910" cy="60" r="2"/><circle cx="950" cy="60" r="2"/>
    <circle cx="750" cy="100" r="2"/><circle cx="790" cy="100" r="2"/><circle cx="830" cy="100" r="2"/><circle cx="870" cy="100" r="2"/><circle cx="910" cy="100" r="2"/><circle cx="950" cy="100" r="2"/>
    <circle cx="750" cy="140" r="2"/><circle cx="790" cy="140" r="2"/><circle cx="830" cy="140" r="2"/><circle cx="870" cy="140" r="2"/><circle cx="910" cy="140" r="2"/><circle cx="950" cy="140" r="2"/>
    <circle cx="750" cy="180" r="2"/><circle cx="790" cy="180" r="2"/><circle cx="830" cy="180" r="2"/><circle cx="870" cy="180" r="2"/><circle cx="910" cy="180" r="2"/><circle cx="950" cy="180" r="2"/>
    <circle cx="750" cy="220" r="2"/><circle cx="790" cy="220" r="2"/><circle cx="830" cy="220" r="2"/><circle cx="870" cy="220" r="2"/><circle cx="910" cy="220" r="2"/><circle cx="950" cy="220" r="2"/>
    <circle cx="990" cy="60" r="2"/><circle cx="1030" cy="60" r="2"/><circle cx="1070" cy="60" r="2"/>
    <circle cx="990" cy="100" r="2"/><circle cx="1030" cy="100" r="2"/><circle cx="1070" cy="100" r="2"/>
    <circle cx="990" cy="140" r="2"/><circle cx="1030" cy="140" r="2"/><circle cx="1070" cy="140" r="2"/>
    <circle cx="990" cy="180" r="2"/><circle cx="1030" cy="180" r="2"/><circle cx="1070" cy="180" r="2"/>
    <circle cx="990" cy="220" r="2"/><circle cx="1030" cy="220" r="2"/><circle cx="1070" cy="220" r="2"/>
  </g>

  <!-- Large decorative N mark background watermark -->
  <text x="950" y="340" font-family="Georgia, serif" font-size="320" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.025">N</text>

  <!-- Left: Icon block -->
  <rect x="70" y="130" width="90" height="100" rx="16" fill="#FF6B00"/>
  <text x="115" y="198" font-family="Georgia, serif" font-size="62" font-weight="700" fill="white" text-anchor="middle">N</text>

  <!-- Main heading -->
  <text x="185" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#FF6B00" text-anchor="start">Naukari</text>
  <text x="185" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#FF6B00" text-anchor="start" dx="430">360</text>
  <text x="185" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#3BA8FF" text-anchor="start" dx="430">360</text>
  <!-- Overlap fix using positions -->
  <text x="620" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#3BA8FF">360°</text>

  <!-- Hindi tagline -->
  <text x="185" y="225" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8BAABB" text-anchor="start" letter-spacing="3">सरकारी नौकरी अपडेट 360°</text>

  <!-- English tagline -->
  <text x="185" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94A3B8" text-anchor="start">Your one-stop destination for latest Government Jobs, Results &amp; Admit Cards</text>

  <!-- Category pills -->
  <rect x="185" y="300" width="110" height="32" rx="16" fill="#FF6B00" opacity="0.15"/>
  <rect x="185" y="300" width="110" height="32" rx="16" fill="none" stroke="#FF6B00" stroke-width="1"/>
  <text x="240" y="321" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FF6B00" text-anchor="middle">Latest Jobs</text>

  <rect x="307" y="300" width="90" height="32" rx="16" fill="#3BA8FF" opacity="0.12"/>
  <rect x="307" y="300" width="90" height="32" rx="16" fill="none" stroke="#3BA8FF" stroke-width="1"/>
  <text x="352" y="321" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3BA8FF" text-anchor="middle">Results</text>

  <rect x="409" y="300" width="110" height="32" rx="16" fill="#3BA8FF" opacity="0.12"/>
  <rect x="409" y="300" width="110" height="32" rx="16" fill="none" stroke="#3BA8FF" stroke-width="1"/>
  <text x="464" y="321" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3BA8FF" text-anchor="middle">Admit Card</text>

  <rect x="531" y="300" width="110" height="32" rx="16" fill="#FF6B00" opacity="0.12"/>
  <rect x="531" y="300" width="110" height="32" rx="16" fill="none" stroke="#FF6B00" stroke-width="1"/>
  <text x="586" y="321" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FF6B00" text-anchor="middle">Answer Key</text>

  <!-- Bottom border line -->
  <rect x="0" y="394" width="1200" height="6" fill="#FF6B00" opacity="0.3"/>

  <!-- Website URL bottom right -->
  <text x="1130" y="380" font-family="Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="end">naukari360.in</text>
</svg>
