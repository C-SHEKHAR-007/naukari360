<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="bgLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#12263a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="120" rx="16" fill="url(#bgLogo)"/>

  <!-- Left orange accent stripe -->
  <rect x="0" y="0" width="6" height="120" rx="3" fill="#FF6B00"/>

  <!-- Icon mark: N in rounded square -->
  <rect x="22" y="22" width="66" height="76" rx="12" fill="#FF6B00"/>
  <rect x="22" y="22" width="66" height="76" rx="12" fill="none" stroke="#FF8C33" stroke-width="1.5"/>
  <!-- N letter inside -->
  <text x="55" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">N</text>

  <!-- Brand name -->
  <text x="106" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#FF6B00" text-anchor="start">Naukari</text>
  <text x="330" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#3BA8FF" text-anchor="start">360</text>
  <text x="390" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#FF6B00" text-anchor="start">°</text>

  <!-- Tagline -->
  <text x="106" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#8BAABB" text-anchor="start" letter-spacing="2">सरकारी नौकरी अपडेट 360°</text>

  <!-- BETA badge -->
  <rect x="106" y="92" width="38" height="16" rx="4" fill="#FF6B00" opacity="0.15"/>
  <rect x="106" y="92" width="38" height="16" rx="4" fill="none" stroke="#FF6B00" stroke-width="0.8"/>
  <text x="125" y="104" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">BETA</text>
</svg>
