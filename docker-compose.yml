# PostgreSQL runs natively on the host (not in Docker). Containers reach it at
# host.docker.internal:5432 via DOCKER_DATABASE_URL in .env (DATABASE_URL is
# the localhost URL for host-side tools). The host's PostgreSQL must listen on
# the docker0 address (172.17.0.1) and allow 172.16.0.0/12 in pg_hba.conf.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL in .env}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID}
      - REVALIDATION_SECRET=${REVALIDATION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - INGEST_API_KEY=${INGEST_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev

  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - '5555:5555'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL in .env}
    command: pnpm prisma studio --port 5555 --browser none
