services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://sarkari:sarkari123@db:5432/naukari360
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID}
      - REVALIDATION_SECRET=dev-revalidation-secret
      - ADMIN_EMAIL=${ADMIN_EMAIL:-naukari360.official@gmail.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev

  db:
    image: postgres:16-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: naukari360
      POSTGRES_USER: sarkari
      POSTGRES_PASSWORD: sarkari123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sarkari -d naukari360']
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: naukari360_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test123
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d naukari360_test']
      interval: 5s
      timeout: 5s
      retries: 5

  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=postgresql://sarkari:sarkari123@db:5432/naukari360
    depends_on:
      db:
        condition: service_healthy
    command: pnpm prisma studio --port 5555 --browser none

volumes:
  postgres_data:
